services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentsignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentsignal}
      POSTGRES_DB: ${POSTGRES_DB:-talentsignal}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentsignal} -d ${POSTGRES_DB:-talentsignal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-talentsignal}:${POSTGRES_PASSWORD:-talentsignal}@db:5432/${POSTGRES_DB:-talentsignal}
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # No fallback, on purpose: getJwtSecret() fails the container fast at
      # boot if this isn't set to a real 32+ char value in your own .env.
      JWT_SECRET: ${JWT_SECRET}
      # Optional. Both must be set to create the one bootstrap admin; leave
      # unset (the default) and no admin account is created.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      # S-18 (06_decisions/028): all three optional, unset by default so
      # normal `docker compose up` behavior is unchanged. Set in the shell
      # or .env before `docker compose up` to run the load-test harness
      # against real seed volume and/or a larger connection pool.
      MARKET_SIGNAL_PROVIDER: ${MARKET_SIGNAL_PROVIDER:-}
      SEED_SIGNAL_COUNT: ${SEED_SIGNAL_COUNT:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # vite.config.ts defaults this to localhost:4000 for native `npm run
      # dev` (no Docker); inside this Compose network the backend is only
      # reachable by its service name.
      VITE_DEV_API_PROXY_TARGET: http://backend:4000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
