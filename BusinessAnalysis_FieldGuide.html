    const flush = () => { if (buf.length) addChunk(sec, head, buf.join(" "), first); buf = []; blen = 0; first = null; };
    root.querySelectorAll("h1,h2,h3,p,li,tr,summary,blockquote,pre,.ac").forEach(el => {
      if (sec.id === "faq" && el.closest("details.faq")) return;
      if (el.closest(".toolbar,.pager,svg")) return;
      if (el.matches("p,li") && el.closest("td,th,.ac")) return;
      const t = el.textContent.replace(/\s+/g, " ").trim();
      if (!t) return;
      if (/^H[123]$/.test(el.tagName)){ flush(); head = t.replace(/^\d+\.\s*/, ""); first = el; return; }
      if (el.tagName === "TR"){
        if (el.closest("thead")) return;
        const cells = [...el.children].map(c => c.textContent.replace(/\s+/g, " ").trim());
        addChunk(sec, head, cells.join(" | "), el, {title:cells.slice(0, 2).join(" ")});
        return;
      }
      if (!first) first = el;
      buf.push(t); blen += t.length;
      if (blen > 520) flush();
    });
    flush();
  });
  FAQ.forEach(f => {
    const sec = SECTIONS.find(s => s.id === f.s) || SECTIONS[0];
    addChunk({id:sec.id, t:sec.t}, "FAQ", f.a, null, {faq:true, q:f.q, a:f.a, title:f.q, keys:f.k + " " + f.q});
  });
  /* data-driven chunks so that "what does FR-16 say" works from any wording */
  REQS.forEach(r => addChunk(SECTIONS.find(s => s.id === "doc-brd"), r.id + " requirement", r.nm + ". " + r.text + " Priority " + r.pri + ".", null, {title:r.id + " " + r.nm, data:"req", ref:r.id}));
  STORIES.forEach(s => addChunk(SECTIONS.find(x => x.id === "doc-us"), s.id + " user story", persona(s.p).name + " wants " + s.want + " so that " + s.so + ". " + s.ac.map(a => a[0].replace(/\*$/, "")).join(". "), null, {title:s.id + " " + s.want, data:"story", ref:s.id}));
  UCS.forEach(u => addChunk(SECTIONS.find(x => x.id === "doc-uc"), u.id + " use case", u.name + ". Actor " + u.actor + ". Trigger " + u.trigger + " " + u.main.join(" "), null, {title:u.id + " " + u.name, data:"uc", ref:u.id}));
  NCH = INDEX.length;
}
function idf(t){ return Math.log(1 + NCH / (1 + (DF[t] || 0))); }
function scoreChunks(q){
  const qt = [...new Set(tokens(q))];
  if (!qt.length) return [];
  const ql = q.toLowerCase().trim();
  const out = [];
  INDEX.forEach(c => {
    let s = 0, hit = 0;
    qt.forEach(t => {
      const tf = c.bTok.reduce((a, x) => a + (x === t ? 1 : 0), 0), inT = c.tTok.includes(t);
      if (tf || inT) hit++;
      s += idf(t) * (Math.min(tf, 3) * 1 + (inT ? 3 : 0) + (c.faq && inT ? 2 : 0));
    });
    if (!hit) return;
    s *= (0.5 + 0.5 * hit / qt.length);
    if (hit === qt.length && qt.length > 1) s *= 1.35;
    if (qt.length > 1 && c.text.toLowerCase().includes(ql)) s += 6;
    if (c.faq && c.q.toLowerCase().replace(/[?]/g, "") === ql.replace(/[?]/g, "")) s += 30;
    out.push({c, s, hit, n:qt.length});
  });
  return out.sort((a, b) => b.s - a.s);
}

/* ---------- navigation ---------- */
let CUR = null;
function buildNav(){
  let h = "", g = "", i = 0;
  SECTIONS.forEach(s => {
    if (s.g !== g){ g = s.g; h += `<h4>${esc(g)}</h4>`; }
    h += `<a href="#/${s.id}" data-sec="${s.id}"><span class="n">${i ? i : ""}</span><span>${esc(s.t)}</span></a>`;
    i++;
  });
  let meta = {}; try { meta = JSON.parse(document.getElementById("deepdive-metadata").textContent); } catch (e) {}
  h += `<div class="navfoot">${esc(meta.guide_type || "Business Analyst Field Guide")}<br>Week ${esc(meta.week || 1)} &middot; v${esc(meta.version || "")}<br>Build ${esc(meta.build_number || "")}<br>Generated ${esc(meta.generated_date || "")}</div>`;
  document.getElementById("nav").innerHTML = h;
}
function buildSections(){
  const main = document.getElementById("main");
  main.innerHTML = SECTIONS.map((s, i) => {
    const prev = SECTIONS[i - 1], next = SECTIONS[i + 1];
    return `<section class="sec" id="s-${s.id}" data-id="${s.id}">${TEACH[s.id]()}
      <div class="pager">${prev ? `<a href="#/${prev.id}"><small>Previous</small>${esc(prev.t)}</a>` : "<span></span>"}${next ? `<a class="nx" href="#/${next.id}"><small>Next</small>${esc(next.t)}</a>` : ""}</div></section>`;
  }).join("");
}
function show(id, focusEl){
  if (!SECTIONS.some(s => s.id === id)) id = "home";
  document.querySelectorAll(".sec.on").forEach(e => e.classList.remove("on"));
  const sec = document.getElementById("s-" + id); sec.classList.add("on");
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.sec === id));
  const meta = SECTIONS.find(s => s.id === id);
  document.title = (id === "home" ? "" : meta.t + " - ") + "Business Analyst Field Guide";
  document.getElementById("nav").classList.remove("open");
  CUR = id;
  if (focusEl){ focusEl.scrollIntoView({block:"center"}); focusEl.classList.add("flash"); setTimeout(() => focusEl.classList.remove("flash"), 2400); }
  else window.scrollTo(0, 0);
}
function go(id, el){
  if (location.hash === "#/" + id){ show(id, el); return; }
  PENDING_FOCUS = el || null;
  location.hash = "#/" + id;
}
let PENDING_FOCUS = null;
function onRoute(){
  const id = (location.hash.match(/^#\/([\w-]+)/) || [])[1] || "home";
  const f = PENDING_FOCUS; PENDING_FOCUS = null;
  show(id, f);
}

/* ---------- search UI ---------- */
function snippet(text, qt){
  const low = text.toLowerCase();
  let pos = -1;
  for (const t of qt){ const i = low.indexOf(t.slice(0, Math.max(3, t.length - 1))); if (i >= 0 && (pos < 0 || i < pos)) pos = i; }
  const start = Math.max(0, (pos < 0 ? 0 : pos) - 60), end = Math.min(text.length, start + 170);
  let s = (start ? "..." : "") + text.slice(start, end) + (end < text.length ? "..." : "");
  s = esc(s);
  qt.forEach(t => { if (t.length > 2) s = s.replace(new RegExp("(" + t.slice(0, Math.max(3, t.length - 1)).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-z0-9]*)", "ig"), "<mark>$1</mark>"); });
  return s;
}
let RES = [], RESI = -1;
function doSearch(q){
  const box = document.getElementById("results");
  q = q.trim();
  if (q.length < 2){ box.hidden = true; return; }
  const scored = scoreChunks(q).filter(r => !r.c.data || r.s > 0);
  const seen = {}, picks = [];
  for (const r of scored){
    const key = r.c.sec;
    seen[key] = (seen[key] || 0) + 1;
    if (seen[key] > 2) continue;
    if (r.c.faq && scored.some(o => !o.c.faq && o.c.sec === r.c.sec && o.s >= r.s * 0.9)) { /* prefer concrete content over FAQ duplicate */ }
    picks.push(r); if (picks.length >= 8) break;
  }
  RES = picks; RESI = -1;
  const qt = tokens(q);
  box.innerHTML = picks.length ? picks.map((r, i) => `<a class="res" data-i="${i}" href="#/${r.c.sec}"><div class="rs">${esc(r.c.secTitle)}</div><div class="rt">${esc(r.c.faq ? r.c.q : (r.c.title || r.c.head))}</div><div class="rx">${snippet(r.c.faq ? r.c.a : r.c.text, qt)}</div></a>`).join("") : `<div class="res-empty">No results for <b>${esc(q)}</b>. Try a requirement ID such as FR-16, or a term such as persona, ROI or unhappy path.</div>`;
  box.hidden = false;
}
function openResult(i){
  const r = RES[i]; if (!r) return;
  document.getElementById("results").hidden = true;
  go(r.c.sec, r.c.el && r.c.el.isConnected ? r.c.el : null);
}

/* ---------- Ask the Guide ---------- */
const ASK_SUGGEST = ["What is MoSCoW?", "What is a trust scenario?", "How do I review an AI-written BRD?", "What is the ROI and payback?", "What is FR-16?", "Which requirements are Must?"];
function lookupIds(q){
  const out = [], seen = new Set();
  const re = /\b(NFR|FR|US|UC|BO|SH)[\s-]?(\d{1,2})\b/gi; let m;
  while ((m = re.exec(q)) && out.length < 3){
    const kind = m[1].toUpperCase(), n = m[2].padStart(2, "0"), id = kind + "-" + n;
    if (seen.has(id)) continue; seen.add(id);
    if (kind === "FR" || kind === "NFR"){
      const r = reqById(id); if (!r) continue;
      out.push({sec:"doc-brd", html:`<p><b>${esc(r.id)}: ${esc(r.nm)}</b> (${esc(r.pri)}, ${esc(r.rel)})</p><p>${esc(r.text)}</p><p>Objectives: ${esc(r.bo.join(", ") || "none (deferred)")}. Stories: ${esc(storiesFor(r).join(", ") || "none")}. Use cases: ${esc(ucsFor(r).join(", ") || "none")}. Test: ${esc(r.pri === "Won't" ? "n/a" : r.tc + " (" + r.tm + ")")}.</p>${r.why ? `<p>Why deferred: ${esc(r.why)}</p>` : ""}`});
    } else if (kind === "US"){
      const s = STORIES.find(x => x.id === id); if (!s) continue; const p = persona(s.p);
      out.push({sec:"doc-us", html:`<p><b>${esc(s.id)}</b> (${esc(s.pri)}): As ${esc(p.name)} (${esc(p.role.split(",")[0])}), I want ${esc(s.want)}, so that ${esc(s.so)}.</p><p>Scenarios: ${s.ac.map(a => esc(a[0].replace(/\*$/, "") + (/\*$/.test(a[0]) ? " (unhappy path)" : ""))).join("; ")}. Requirement: ${esc(s.reqs.join(", "))}.</p>`});
    } else if (kind === "UC"){
      const u = UCS.find(x => x.id === id); if (!u) continue;
      out.push({sec:"doc-uc", html:`<p><b>${esc(u.id)}: ${esc(u.name)}</b></p><p>Actor: ${esc(u.actor)}. Trigger: ${esc(u.trigger)}</p><p>Main flow has ${u.main.length} steps, with ${u.alt.length} alternate and ${u.exc.length} exception flows. First failure handled: ${esc(u.exc[0][1])}: ${esc(u.exc[0][2])}</p>`});
    } else if (kind === "BO"){
      const b = BOS.find(x => x.id === id); if (!b) continue;
      out.push({sec:"doc-brd", html:`<p><b>${esc(b.id)}</b>: ${esc(b.text)}</p><p>Metric: ${esc(b.metric)}. Baseline ${esc(b.baseline)}, target ${esc(b.target)}. Source: ${esc(b.source)}. Owner: ${esc(b.owner)}, ${esc(b.cadence.toLowerCase())}.</p><p>Requirements serving it: ${esc(REQS.filter(r => r.bo.includes(b.id)).map(r => r.id).join(", "))}.</p>`});
    } else if (kind === "SH"){
      const s = STAKE.find(x => x.id === id); if (!s) continue;
      out.push({sec:"doc-stk", html:`<p><b>${esc(s.name)}</b>, ${esc(s.role)}. Power ${esc(s.power)}, interest ${esc(s.interest)} (${esc(s.quad)}).</p><p>Concern: ${esc(s.concern)}. Engagement: ${esc(s.strategy)}. Cadence: ${esc(s.cadence)}.</p>`});
    }
  }
  const pm = q.match(/\bP([1-6])\b/);
  if (pm && out.length < 3){ const p = persona("P" + pm[1]); if (p) out.push({sec:"doc-per", html:`<p><b>${esc(p.name)}</b>, ${esc(p.role)}.</p><p>&ldquo;${esc(p.quote)}&rdquo;</p><p>Goals: ${esc(p.goals.join("; "))}.</p><p>Decision rights: ${esc(p.authority)}</p>`}); }
  return out;
}
function askAnswer(q){
  const ids = lookupIds(q);
  if (ids.length){
    return {html:ids.map(x => x.html).join(""), srcs:[...new Set(ids.map(x => x.sec))], rel:[]};
  }
  const sc = scoreChunks(q);
  const top = sc[0];
  if (!top || top.s < 2.2) return null;
  const faqTop = sc.find(x => x.c.faq && x.s >= top.s * 0.62);
  const best = faqTop || top;
  let html;
  if (best.c.faq) html = `<p>${esc(best.c.a)}</p>`;
  else {
    const t = best.c.text.length > 520 ? best.c.text.slice(0, 520).replace(/\s+\S*$/, "") + "..." : best.c.text;
    html = `<p><b>${esc(best.c.head)}</b></p><p>${esc(t)}</p>`;
  }
  const rel = []; const seenS = new Set([best.c.sec]);
  for (const r of sc){ if (rel.length >= 3) break; if (seenS.has(r.c.sec)) continue; seenS.add(r.c.sec); rel.push(r.c); }
  return {html, srcs:[best.c.sec], rel, el:!best.c.faq && !best.c.data && best.c.el && best.c.el.isConnected ? best.c.el : null};
}
function askSay(who, html){
  const log = document.getElementById("askLog");
  const d = document.createElement("div"); d.className = "msg " + who; d.innerHTML = html; log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function askSubmit(q){
  q = q.trim(); if (!q) return;
  openAsk();
  askSay("u", esc(q));
  const a = askAnswer(q);
  if (!a){
    askSay("a", `<p>I could not find that in this guide. I only answer from the guide's own content, so I will not guess.</p><p>Try different words, a requirement ID such as FR-16, or browse: ${["why-ba", "good-bad", "review-lens", "doc-brd", "faq"].map(id => `<a href="#/${id}" data-close-ask>${esc(SECTIONS.find(s => s.id === id).t)}</a>`).join(" &middot; ")}</p>`);
    return;
  }
  const secName = id => (SECTIONS.find(s => s.id === id) || {}).t || id;
  askSay("a", a.html + `<div class="src">Source: ${a.srcs.map(id => `<a href="#/${id}" data-close-ask>${esc(secName(id))}</a>`).join(", ")}</div>` + (a.rel.length ? `<div class="rel">Related: ${a.rel.map(c => `<a href="#/${c.sec}" data-close-ask>${esc(c.secTitle)}</a>`).join(" &middot; ")}</div>` : ""));
}
function openAsk(){
  const a = document.getElementById("ask"); a.hidden = false;
  if (!a.dataset.init){
    a.dataset.init = "1";
    askSay("a", `<p>I answer questions from this guide's own content: the discipline sections, the FAQ and all nine documents. Ask in plain words, or look up an ID such as <b>FR-16</b> or <b>US-10</b>.</p>`);
    document.getElementById("askChips").innerHTML = ASK_SUGGEST.map(s => `<button class="chip" data-ask="${esc(s)}">${esc(s)}</button>`).join("");
  }
  setTimeout(() => document.getElementById("askIn").focus(), 30);
}

/* ---------- downloads ---------- */
function toast(msg){
  let t = document.getElementById("toast");
  if (!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 2800);
}
function saveBlob(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function printDoc(d){
  const f = document.createElement("iframe");
  f.setAttribute("aria-hidden", "true"); f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
  const oldTitle = document.title;
  document.body.appendChild(f);
  f.onload = () => setTimeout(() => {
    document.title = d.title + " - " + CO.name;
    const done = () => { document.title = oldTitle; setTimeout(() => f.remove(), 500); };
    f.contentWindow.addEventListener("afterprint", done, {once:true});
    f.contentWindow.focus(); f.contentWindow.print();
    setTimeout(() => { if (document.title !== oldTitle) done(); }, 60000);
  }, 350);
  f.srcdoc = standaloneHTML(d);
  toast("Preparing PDF: choose 'Save as PDF' in the print dialog");
}
function download(kind, docId){
  const d = DOCS.find(x => x.id === docId); if (!d) return;
  const base = CO.code + "_" + d.short + "_v" + d.version;
  if (kind === "html"){ saveBlob(base + ".html", standaloneHTML(d), "text/html;charset=utf-8"); toast("Downloaded " + base + ".html"); }
  else if (kind === "csv"){ saveBlob(base + "_" + d.csv + ".csv", CSV[d.csv](), "text/csv;charset=utf-8"); toast("Downloaded " + base + "_" + d.csv + ".csv"); }
  else if (kind === "pdf") printDoc(d);
}
function copyFrom(id, btn){
  const el = document.getElementById(id); if (!el) return;
  const done = () => { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = o; }, 1800); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(el.textContent).then(done, () => fallbackCopy(el, done));
  else fallbackCopy(el, done);
}
function fallbackCopy(el, done){
  const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  try { document.execCommand("copy"); done(); } catch (e) {} s.removeAllRanges();
}

/* ---------- theme ---------- */
function effectiveDark(){
  const t = document.documentElement.getAttribute("data-theme");
  if (t) return t === "dark";
  return !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
}
function setThemeLabel(){ document.getElementById("themeBtn").textContent = effectiveDark() ? "Light" : "Dark"; }
function initTheme(){
  try { const t = localStorage.getItem("bafg-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  setThemeLabel();
  document.getElementById("themeBtn").addEventListener("click", () => {
    const next = effectiveDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("bafg-theme", next); } catch (e) {}
    setThemeLabel();
  });
}

/* ---------- init ---------- */
function init(){
  const st = document.createElement("style"); st.textContent = DOC_CSS + GUIDE_CSS; document.head.appendChild(st);
  initTheme();
  buildNav(); buildSections(); buildIndex();
  window.addEventListener("hashchange", onRoute);
  onRoute();

  const q = document.getElementById("q"), box = document.getElementById("results");
  q.addEventListener("input", () => doSearch(q.value));
  q.addEventListener("focus", () => { if (q.value.trim().length > 1) doSearch(q.value); });
  q.addEventListener("keydown", e => {
    const items = [...box.querySelectorAll(".res")];
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault(); if (!items.length) return;
      RESI = (RESI + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items.forEach((it, i) => it.classList.toggle("on", i === RESI)); items[RESI].scrollIntoView({block:"nearest"});
    } else if (e.key === "Enter"){ e.preventDefault(); if (RESI >= 0) openResult(RESI); else if (RES.length) openResult(0); }
    else if (e.key === "Escape"){ box.hidden = true; q.blur(); }
  });
  box.addEventListener("mousedown", e => { const a = e.target.closest(".res"); if (a){ e.preventDefault(); openResult(+a.dataset.i); } });
  document.addEventListener("click", e => {
    if (!e.target.closest(".searchwrap")) box.hidden = true;
    const t = e.target.closest("[data-ask]"); if (t){ askSubmit(t.dataset.ask); return; }
    const dl = e.target.closest("[data-dl]"); if (dl){ download(dl.dataset.dl, dl.dataset.doc); return; }
    const cp = e.target.closest("[data-copy]"); if (cp){ copyFrom(cp.dataset.copy, cp); return; }
    if (e.target.closest("#nav a")) document.getElementById("nav").classList.remove("open");
    if (e.target.closest("[data-close-ask]") && window.innerWidth < 900) document.getElementById("ask").hidden = true;
  });
  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "");
    if (e.key === "/" && !typing && !e.ctrlKey && !e.metaKey){ e.preventDefault(); q.focus(); q.select(); }
    if (e.key === "Escape"){ document.getElementById("ask").hidden = true; }
  });
  document.addEventListener("submit", e => {
    if (e.target.id === "homeAsk"){ e.preventDefault(); const i = document.getElementById("homeAskIn"); askSubmit(i.value); i.value = ""; }
  });
  document.getElementById("askForm").addEventListener("submit", e => { e.preventDefault(); const i = document.getElementById("askIn"); const v = i.value; i.value = ""; askSubmit(v); });
  document.getElementById("askBtn").addEventListener("click", openAsk);
  document.getElementById("askClose").addEventListener("click", () => { document.getElementById("ask").hidden = true; });
  document.getElementById("menuBtn").addEventListener("click", () => document.getElementById("nav").classList.toggle("open"));
}
if (typeof document !== "undefined") init();

</script>
