:root{

  --radius:6px;

  :root:not([data-theme="light"]){
    --cherry:#FF5960; --berry:#5EA9C4; --leaf:#8AC759;

  --on-cherry:#0F0F0F; --on-berry:#0F0F0F;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--berry);text-decoration:none} a:hover{text-decoration:underline}
code,kbd,.mono{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2px solid var(--berry);outline-offset:2px}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;height:62px;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;color:var(--text);flex:none}
.brand:hover{text-decoration:none}
.brand img{height:38px;width:auto;display:block}
.brand-t{font-weight:500;font-size:15px;color:var(--berry);padding-left:12px;border-left:1px solid var(--border);white-space:nowrap}
.searchwrap{position:relative;flex:1;max-width:620px;margin:0 auto}
.searchwrap input{width:100%;height:40px;padding:0 40px 0 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font:inherit;font-size:14px}
.searchwrap input:focus{outline:2px solid var(--berry);background:var(--bg)}
.searchwrap kbd{position:absolute;right:10px;top:9px;border:1px solid var(--border);border-radius:4px;padding:0 6px;color:var(--muted);font-size:12px;line-height:20px;background:var(--bg)}
.results{position:absolute;left:0;right:0;top:46px;max-height:70vh;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 12px 32px rgba(26,26,26,.18)}
.results[hidden]{display:none}
.res{display:block;padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);cursor:pointer}
.res:last-child{border-bottom:0}
.res:hover,.res.on{background:var(--surface);text-decoration:none}
.res .rt{font-weight:500;font-size:14px}
.res .rs{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.res .rx{font-size:13px;color:var(--muted);margin-top:2px}
.res mark{background:none;color:var(--cherry);font-weight:700}
.res-empty{padding:14px;color:var(--muted);font-size:14px}
.btn{font:inherit;font-size:14px;font-weight:500;height:38px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--surface);text-decoration:none}
.btn.primary{background:var(--cherry);border-color:var(--cherry);color:var(--on-cherry)}
.btn.primary:hover{filter:brightness(.94);background:var(--cherry)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.berry{background:var(--berry);border-color:var(--berry);color:var(--on-berry)}
.btn.berry:hover{background:var(--berry);filter:brightness(.94)}
.menu-btn{display:none}
.bs{display:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:288px minmax(0,1fr);max-width:1480px;margin:0 auto}
.nav{position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);overflow:auto;padding:22px 14px 40px 20px;border-right:1px solid var(--border);background:var(--bg)}
.nav h4{margin:20px 0 6px;padding:0 10px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav h4:first-child{margin-top:0}
.nav a{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-radius:var(--radius);color:var(--text);font-size:14px;border-left:3px solid transparent}
.nav a:hover{background:var(--surface);text-decoration:none}
.nav a.on{background:var(--surface);border-left-color:var(--cherry);font-weight:500;color:var(--berry)}
.nav a .n{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:16px}
main{padding:34px 44px 80px;min-width:0}
.sec{display:none;max-width:1000px}
.sec.on{display:block}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
main h1{margin:0 0 10px;font-size:32px;line-height:1.2;font-weight:700;color:var(--berry);letter-spacing:-.01em}
main h2{margin:36px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);font-size:21px;font-weight:700;color:var(--berry)}
main h3{margin:24px 0 8px;font-size:16.5px;font-weight:700;color:var(--text)}
main p{margin:0 0 12px}
main ul,main ol{margin:0 0 14px;padding-left:22px}
main li{margin:3px 0}
.lede{font-size:18px;line-height:1.55;color:var(--muted);margin:0 0 22px;max-width:760px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:14px 0 18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:14px 0 18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:14px 0 18px}
.card{border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;background:var(--surface)}
.card h3{margin:0 0 6px;font-size:15.5px;color:var(--berry)}
.card p:last-child,.card ul:last-child{margin-bottom:0}
.card .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
a.card{display:block;color:var(--text)} a.card:hover{text-decoration:none;border-color:var(--berry)}
.call{border-left:4px solid var(--berry);background:var(--surface);padding:12px 16px;margin:16px 0;border-radius:0 var(--radius) var(--radius) 0}
.call.ok{border-left-color:var(--leaf)} .call.warn{border-left-color:var(--amber)} .call.key{border-left-color:var(--cherry)}
.call b.lbl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.call p:last-child{margin-bottom:0}
table.t{width:100%;border-collapse:collapse;margin:12px 0 18px;font-size:14px}
table.t th{background:var(--berry);color:var(--on-berry);text-align:left;font-weight:500;padding:8px 10px;font-size:13px}
table.t td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
table.t tr:nth-child(even) td{background:var(--surface)}
.tscroll{overflow-x:auto}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:18px;border-top:1px solid var(--border)}
.pager a{display:block;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius);color:var(--text);min-width:200px}
.pager a:hover{border-color:var(--berry);text-decoration:none}
.pager small{display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pager .nx{text-align:right;margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--border);border-radius:999px;background:var(--bg);color:var(--text);cursor:pointer}
.chip:hover{border-color:var(--berry);color:var(--berry)}
details.faq{border:1px solid var(--border);border-radius:var(--radius);margin:8px 0;background:var(--bg)}
details.faq summary{cursor:pointer;padding:11px 16px;font-weight:500;list-style:none}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary:before{content:"+";display:inline-block;width:20px;color:var(--cherry);font-family:var(--mono);font-weight:700}
details.faq[open] summary:before{content:"-"}
details.faq .a{padding:0 16px 14px 36px}
.hero{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:34px 34px 28px;margin-bottom:22px}
.hero h1{font-size:36px}
.hero form{display:flex;gap:10px;margin-top:18px;max-width:680px}
.hero input{flex:1;height:44px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius);font:inherit;background:var(--bg);color:var(--text)}
.hero .btn{height:44px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 18px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.toolbar .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:auto}
.paper{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 18px rgba(26,26,26,.10);background:#FFFFFF}
.exhibit{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin:14px 0 18px;background:#FFFFFF;color:#1A1A1A;overflow-x:auto}
.exhibit .cap{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6B6B6B;margin-bottom:8px}
.exhibit svg{display:block;max-width:100%;height:auto}

/* ---------- Ask drawer ---------- */
.ask{position:fixed;top:62px;right:0;bottom:0;width:410px;max-width:100%;z-index:60;display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--border);box-shadow:-12px 0 32px rgba(26,26,26,.16)}
.ask[hidden]{display:none}
.ask header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ask header b{color:var(--berry);font-size:16px}
.ask header small{display:block;color:var(--muted);font-size:12px}
#askLog{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:94%;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--berry);color:var(--on-berry)}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--border)}
.msg .src{margin-top:8px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.msg .rel{margin-top:6px;font-size:12.5px;color:var(--muted)}
.msg p{margin:0 0 8px} .msg p:last-child{margin:0}
.ask form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border)}
.ask input{flex:1;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);font:inherit;background:var(--surface);color:var(--text)}
.ask .chips{padding:0 18px 10px;margin:0}

@media (max-width:1100px){ main{padding:28px 24px 70px} .grid4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .nav{position:fixed;left:0;top:62px;bottom:0;width:300px;max-width:88vw;z-index:55;transform:translateX(-102%);transition:transform .18s;height:auto;box-shadow:12px 0 32px rgba(26,26,26,.2)}
  .nav.open{transform:none}
  .menu-btn{display:inline-flex}
  .brand-t{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .btn .bt{display:none} .btn .bs{display:inline}
}
@media (max-width:620px){
  .top{gap:8px;padding:0 12px}
  .searchwrap kbd{display:none}
  main{padding:22px 16px 60px}
  main h1{font-size:26px}
  .hero{padding:22px 18px} .hero h1{font-size:28px} .hero form{flex-direction:column}
  .grid4{grid-template-columns:1fr}
  .pager{flex-direction:column} .pager .nx{text-align:left;margin-left:0}
}
@media print{
  .top,.nav,.ask,.pager,.toolbar,.hero form,.chips{display:none!important}
  .shell{display:block} main{padding:0}
  .sec{display:none!important} .sec.on{display:block!important}
}

/* ---------- derived: traceability ---------- */
function storiesFor(req){
  if (req.type === "NFR") return NFR_STORIES[req.id] || [];
  return STORIES.filter(s => s.reqs.includes(req.id)).map(s => s.id);
}
function ucsFor(req){ return UCS.filter(u => u.reqs.includes(req.id)).map(u => u.id); }
function storyUcs(s){ const set = new Set(); s.reqs.forEach(r => ucsFor(reqById(r)).forEach(u => set.add(u))); return [...set]; }
const COUNTS = (function(){
  const c = {Must:0, Should:0, Could:0, "Won't":0};
  REQS.forEach(r => c[r.pri]++);
  return c;
})();
function traceCheck(){
  const problems = [];
  REQS.forEach(r => {
    if (r.pri === "Won't") return;
    if (!r.bo.length) problems.push(r.id + " has no business objective");
    if (!storiesFor(r).length) problems.push(r.id + " has no user story");
    if (!r.tc) problems.push(r.id + " has no test");
  });
  STORIES.forEach(s => s.reqs.forEach(id => { if (!reqById(id)) problems.push(s.id + " points to missing " + id); }));
  BOS.forEach(b => { if (!REQS.some(r => r.bo.includes(b.id))) problems.push(b.id + " has no requirement"); });
  const mustShare = COUNTS.Must / REQS.length;
  if (mustShare > 0.6) problems.push("Must share is " + Math.round(mustShare*100) + "% (over 60%)");
  return problems;
}

/* =====================================================================
   VISUALS - every chart and diagram is generated here as inline SVG.
   No libraries, no network. Colors come only from the Colaberry palette.
   ===================================================================== */
const C = {cherry:"#FB2832", berry:"#367895", leaf:"#5BA63C", amber:"#E8920C", text:"#1A1A1A", muted:"#6B6B6B", border:"#E4E4E3", white:"#FFFFFF", surface:"#F8F8F7"};
const FONT = "Roboto,system-ui,Arial,sans-serif";
const MONOF = "'Roboto Mono',ui-monospace,Consolas,monospace";
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let _uid = 0; const uid = p => (p || "u") + (++_uid);

function wrapText(t, maxChars){
  const words = String(t).split(/\s+/), lines = []; let cur = "";
  words.forEach(w => {
    if (cur && (cur + " " + w).length > maxChars){ lines.push(cur); cur = w; }
    else cur = cur ? cur + " " + w : w;
  });
  if (cur) lines.push(cur);
  return lines;
}
/* multi-line <text>; (x,y) is the vertical CENTER of the block when vmid is true, else the first baseline */
function txt(x, y, lines, o){
  o = Object.assign({size:11.5, anchor:"middle", fill:C.text, weight:400, lh:14, vmid:false, mono:false}, o || {});
  if (!Array.isArray(lines)) lines = [lines];
  const y0 = o.vmid ? y - ((lines.length - 1) * o.lh) / 2 + o.size * 0.35 : y;
  return `<text x="${x}" y="${y0}" text-anchor="${o.anchor}" font-family="${o.mono ? MONOF : FONT}" font-size="${o.size}" font-weight="${o.weight}" fill="${o.fill}">` +
    lines.map((l, i) => `<tspan x="${x}" dy="${i === 0 ? 0 : o.lh}">${esc(l)}</tspan>`).join("") + `</text>`;
}
function svgWrap(w, h, inner, o){
  o = o || {};
  const style = `max-width:100%;height:auto;${o.minW ? "min-width:" + o.minW + "px;" : ""}`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" style="${style}" role="img" aria-label="${esc(o.label || "diagram")}">${inner}</svg>`;
}

/* ---------- KPI tile (HTML) ---------- */
function tile(value, label, sub, tone){
  const col = tone === "good" ? C.leaf : tone === "warn" ? C.amber : tone === "key" ? C.cherry : C.berry;
  return `<div class="tile" style="border-top:3px solid ${col}"><div class="tv">${esc(value)}</div><div class="tl">${esc(label)}</div>${sub ? `<div class="ts">${esc(sub)}</div>` : ""}</div>`;
}

/* ---------- donut ---------- */
function donut(data, o){
  o = Object.assign({size:190, thick:34, center:"", sub:"", label:"donut chart"}, o || {});
  const total = data.reduce((a, d) => a + d.value, 0);
  const r = (o.size - o.thick) / 2 - 4, cx = o.size / 2, cy = o.size / 2, circ = 2 * Math.PI * r;
  let off = 0, segs = "";
  data.forEach(d => {
    const len = d.value / total * circ;
    segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${o.thick}" stroke-dasharray="${Math.max(len - 2, 0)} ${circ - Math.max(len - 2, 0)}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off += len;
  });
  const lx = o.size + 24;
  let leg = "";
  data.forEach((d, i) => {
    const y = 34 + i * 30;
    leg += `<rect x="${lx}" y="${y - 11}" width="14" height="14" rx="2" fill="${d.color}" stroke="${C.muted}" stroke-width="${d.color === C.border ? 1 : 0}"/>`;
    leg += txt(lx + 22, y, d.label, {anchor:"start", size:12});
    leg += txt(lx + 22 + 190, y, (o.unit ? d.value + o.unit : d.value + " (" + Math.round(d.value / total * 100) + "%)"), {anchor:"end", size:12, fill:C.muted, mono:true});
  });
  const W = lx + 22 + 200 + 10;
  const center = txt(cx, cy - 2, o.center, {size:26, weight:700, fill:C.berry}) + txt(cx, cy + 16, o.sub, {size:11, fill:C.muted});
  return svgWrap(W, Math.max(o.size, 34 + data.length * 30), segs + center + leg, {label:o.label});
}

/* ---------- horizontal bars ---------- */
function barsH(data, o){
  o = Object.assign({w:640, labelW:210, unit:"", fmt:v => v, label:"bar chart", color:C.berry}, o || {});
  const max = o.max || Math.max(...data.map(d => d.value)), rowH = 34, barW = o.w - o.labelW - 80;
  let inner = "";
  data.forEach((d, i) => {
    const y = 8 + i * rowH, bw = Math.max(2, d.value / max * barW);
    inner += txt(o.labelW - 10, y + 15, wrapText(d.label, 30), {anchor:"end", size:12, vmid:false, lh:13});
    inner += `<rect x="${o.labelW}" y="${y + 3}" width="${bw}" height="20" rx="3" fill="${d.color || o.color}"/>`;
    inner += txt(o.labelW + bw + 8, y + 18, o.fmt(d.value) + o.unit, {anchor:"start", size:12, weight:500, mono:true});
  });
  return svgWrap(o.w, 16 + data.length * rowH, inner, {label:o.label});
}

/* ---------- baseline vs target, one row per metric (each row has its own scale) ---------- */
function beforeAfter(items, o){
  o = Object.assign({w:660, labelW:200, label:"baseline versus target"}, o || {});
  const barW = o.w - o.labelW - 90, rowH = 58;
  let inner = "";
  inner += `<rect x="${o.labelW}" y="0" width="12" height="12" fill="${C.muted}"/>` + txt(o.labelW + 18, 10, "Baseline", {anchor:"start", size:11});
  inner += `<rect x="${o.labelW + 90}" y="0" width="12" height="12" fill="${C.leaf}"/>` + txt(o.labelW + 108, 10, "Target", {anchor:"start", size:11});
  items.forEach((it, i) => {
    const y = 26 + i * rowH, aw = it.after / it.before * barW;
    inner += txt(o.labelW - 10, y + 22, wrapText(it.label, 28), {anchor:"end", size:12, lh:13});
    inner += `<rect x="${o.labelW}" y="${y}" width="${barW}" height="18" rx="3" fill="${C.muted}"/>`;
    inner += txt(o.labelW + barW + 8, y + 13, it.bl, {anchor:"start", size:12, mono:true, weight:500});
    inner += `<rect x="${o.labelW}" y="${y + 22}" width="${aw}" height="18" rx="3" fill="${C.leaf}"/>`;
    inner += txt(o.labelW + aw + 8, y + 35, it.tl, {anchor:"start", size:12, mono:true, weight:500});
  });
  return svgWrap(o.w, 30 + items.length * rowH, inner, {label:o.label});
}

/* ---------- line chart (cumulative cash flow) ---------- */
function lineChart(labels, values, o){
  o = Object.assign({w:620, h:260, unit:"K", label:"line chart"}, o || {});
  const pl = 64, pr = 28, pt = 26, pb = 40, iw = o.w - pl - pr, ih = o.h - pt - pb;
  const lo = Math.min(0, ...values), hi = Math.max(0, ...values);
  const pad = (hi - lo) * 0.12, y0 = lo - pad, y1 = hi + pad;
  const X = i => pl + i * iw / (values.length - 1), Y = v => pt + (y1 - v) / (y1 - y0) * ih;
  let inner = "";
  const step = Math.ceil((hi - lo) / 4 / 100) * 100;
  for (let v = Math.ceil(y0 / step) * step; v <= y1; v += step){
    inner += `<line x1="${pl}" x2="${o.w - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 0 ? C.muted : C.border}" stroke-width="${v === 0 ? 1.5 : 1}"/>`;
    inner += txt(pl - 8, Y(v) + 4, "$" + v + o.unit, {anchor:"end", size:11, fill:C.muted, mono:true});
  }
  const pts = values.map((v, i) => X(i) + "," + Y(v)).join(" ");
  inner += `<polyline points="${pts}" fill="none" stroke="${C.berry}" stroke-width="3" stroke-linejoin="round"/>`;
  values.forEach((v, i) => {
    inner += `<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="${v < 0 ? C.amber : C.leaf}" stroke="${C.white}" stroke-width="2"/>`;
    inner += txt(X(i), Y(v) + (v < 0 ? 20 : -12), (v < 0 ? "-$" + Math.abs(v) : "$" + v) + o.unit, {size:12, weight:700, mono:true});
    inner += txt(X(i), o.h - 14, labels[i], {size:12, fill:C.muted});
  });
  return svgWrap(o.w, o.h, inner, {label:o.label});
}

/* ---------- power / interest grid ---------- */
function stakeholderGrid(list){
  const W = 560, H = 440, pl = 54, pt = 18, iw = W - pl - 16, ih = H - pt - 52;
  const X = v => pl + v / 100 * iw, Y = v => pt + (100 - v) / 100 * ih;
  let s = `<rect x="${pl}" y="${pt}" width="${iw}" height="${ih}" fill="${C.white}" stroke="${C.border}"/>`;
  s += `<rect x="${X(50)}" y="${pt}" width="${iw / 2}" height="${ih / 2}" fill="${C.surface}"/>`;
  s += `<line x1="${X(50)}" x2="${X(50)}" y1="${pt}" y2="${pt + ih}" stroke="${C.border}"/><line x1="${pl}" x2="${pl + iw}" y1="${Y(50)}" y2="${Y(50)}" stroke="${C.border}"/>`;

  s += txt(pl + iw - 8, pt + 18, "MANAGE CLOSELY", {anchor:"end", size:10.5, fill:C.berry, mono:true, weight:700});
  s += txt(pl + 8, pt + ih - 10, "MONITOR", {anchor:"start", size:10.5, fill:C.muted, mono:true, weight:500});
  s += txt(pl + iw - 8, pt + ih - 10, "KEEP INFORMED", {anchor:"end", size:10.5, fill:C.muted, mono:true, weight:500});
  s += txt(pl + iw / 2, H - 10, "INTEREST in the initiative  (low to high)", {size:11, fill:C.muted});
  s += `<text transform="translate(14 ${pt + ih / 2}) rotate(-90)" text-anchor="middle" font-family="${FONT}" font-size="11" fill="${C.muted}">POWER over the outcome  (low to high)</text>`;
  list.forEach((p, i) => {

  return svgWrap(W, H, s, {label:"Stakeholder power and interest grid"});
}

/* ---------- swimlane process map ---------- */
function swimlane(cfg){
  const colW = 146, w = 118, h = 58, laneH = 94, left = 106;
  const maxCol = Math.max(...cfg.steps.map(s => s.col));
  const W = left + (maxCol + 1) * colW + 6, H = cfg.lanes.length * laneH + 4;
  const mid = uid("ar");
  let s = `<defs><marker id="${mid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${C.muted}"/></marker></defs>`;
  cfg.lanes.forEach((ln, i) => {
    s += `<rect x="0" y="${i * laneH}" width="${W}" height="${laneH}" fill="${i % 2 ? C.white : C.surface}" stroke="${C.border}"/>`;
    s += `<rect x="0" y="${i * laneH}" width="${left - 10}" height="${laneH}" fill="${C.berry}"/>`;
    s += txt((left - 10) / 2, i * laneH + laneH / 2, wrapText(ln, 12), {size:12, weight:500, fill:C.white, vmid:true});
  });
  const P = {};
  cfg.steps.forEach(st => { P[st.id] = {x:left + st.col * colW + 6, y:st.lane * laneH + (laneH - h) / 2, st}; });
  cfg.edges.forEach(e => {
    const a = P[e[0]], b = P[e[1]];
    const ax = a.x + w, ay = a.y + h / 2, bx = b.x, by = b.y + h / 2;
    let d, lx, ly;
    if (Math.abs(ay - by) < 1){ d = `M${ax},${ay} L${bx - 2},${by}`; lx = ax + (bx - ax) / 2; ly = ay - 6; }
    else { const xm = ax + (bx - ax) / 2; d = `M${ax},${ay} H${xm} V${by} H${bx - 2}`; lx = xm; ly = (ay + by) / 2; }
    s += `<path d="${d}" fill="none" stroke="${C.muted}" stroke-width="1.6" marker-end="url(#${mid})"/>`;
    if (e[2]) s += `<rect x="${lx - 15}" y="${ly - 9}" width="30" height="14" rx="3" fill="${C.white}" opacity=".95"/>` + txt(lx, ly + 2, e[2], {size:10.5, weight:700, fill:C.berry, mono:true});
  });
  cfg.steps.forEach(st => {
    const p = P[st.id], x = p.x, y = p.y;
    const stroke = st.type === "gate" ? C.cherry : C.berry, sw = st.type === "gate" ? 2.8 : 1.6;
    if (st.type === "decision"){
      s += `<polygon points="${x + w / 2},${y - 4} ${x + w},${y + h / 2} ${x + w / 2},${y + h + 4} ${x},${y + h / 2}" fill="${C.white}" stroke="${stroke}" stroke-width="${sw}"/>`;
      s += txt(x + w / 2, y + h / 2, wrapText(st.text, 13), {size:11, vmid:true, lh:12.5});
    } else {
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${C.white}" stroke="${stroke}" stroke-width="${sw}"/>`;
      s += txt(x + w / 2, y + h / 2, wrapText(st.text, 21), {size:11, vmid:true, lh:12.5});
    }
    if (st.type === "gate") s += `<rect x="${x + 6}" y="${y - 8}" width="86" height="15" rx="3" fill="${C.cherry}"/>` + txt(x + 49, y + 3, "HUMAN GATE", {size:9.5, weight:700, fill:C.white, mono:true});
    if (st.pain) s += `<circle cx="${x + w - 2}" cy="${y + 2}" r="11" fill="${C.amber}" stroke="${C.white}" stroke-width="2"/>` + txt(x + w - 2, y + 2, String(st.pain), {size:11, weight:700, fill:C.text, vmid:true});
  });
  return svgWrap(W, H, s, {minW:cfg.minW || 1000, label:cfg.label || "process map"});
}

/* ---------- sequence diagram ---------- */
function sequence(cfg){
  const n = cfg.parts.length, colW = 176, W = n * colW, top = 48;
  const mid = uid("sq"), midD = uid("sqd");
  const X = i => colW / 2 + i * colW;
  let y = top + 24, body = "";
  const rows = [];
  cfg.msgs.forEach(m => {
    if (m.note){ rows.push({m, y, h:46}); y += 52; return; }
    const lines = wrapText(m.t, Math.max(14, Math.floor((Math.abs(X(m.to) - X(m.from)) - 14) / 6.2)));
    const h = 22 + lines.length * 13;
    rows.push({m, y:y + lines.length * 13 + 8, h, lines}); y += h + 14;
  });
  const H = y + 24;
  let s = `<defs><marker id="${mid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${C.berry}"/></marker><marker id="${midD}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${C.muted}"/></marker></defs>`;
  cfg.parts.forEach((p, i) => {
    s += `<line x1="${X(i)}" x2="${X(i)}" y1="${top}" y2="${H - 10}" stroke="${C.border}" stroke-width="2" stroke-dasharray="5 5"/>`;
    s += `<rect x="${X(i) - 74}" y="6" width="148" height="38" rx="6" fill="${p.human ? C.white : C.berry}" stroke="${p.human ? C.cherry : C.berry}" stroke-width="${p.human ? 2.5 : 1}"/>`;
    s += txt(X(i), 25, wrapText(p.name, 20), {size:11.5, weight:500, fill:p.human ? C.text : C.white, vmid:true, lh:13});
  });
  rows.forEach(r => {
    const m = r.m;
    if (m.note){
      const a = Math.min(m.from, m.to), b = Math.max(m.from, m.to), x1 = X(a) - 60, x2 = X(b) + 60;
      s += `<rect x="${x1}" y="${r.y}" width="${x2 - x1}" height="38" rx="6" fill="${C.surface}" stroke="${m.gate ? C.cherry : C.amber}" stroke-width="${m.gate ? 2.5 : 1.6}"/>`;
      s += txt((x1 + x2) / 2, r.y + 19, wrapText(m.note, Math.floor((x2 - x1) / 6.3)), {size:11, vmid:true, lh:13, weight:500});
      return;
    }
    const x1 = X(m.from), x2 = X(m.to), dash = m.dash;
    s += `<line x1="${x1}" y1="${r.y}" x2="${x2 + (x2 > x1 ? -2 : 2)}" y2="${r.y}" stroke="${dash ? C.muted : C.berry}" stroke-width="1.8" ${dash ? 'stroke-dasharray="6 4"' : ""} marker-end="url(#${dash ? midD : mid})"/>`;
    s += txt((x1 + x2) / 2, r.y - 6 - (r.lines.length - 1) * 13, r.lines, {size:11, lh:13});
  });
  return svgWrap(W, H, s, {label:cfg.label || "sequence diagram"});
}

/* ---------- entity relationship diagram ---------- */
function erd(ents, rels){
  const ew = 196, hh = 26, rh = 17, gx = 52, pitch = 186, pad = 30;
  const maxC = Math.max(...ents.map(e => e.c)), maxR = Math.max(...ents.map(e => e.r));
  const W = pad * 2 + (maxC + 1) * ew + maxC * gx, H = (maxR + 1) * pitch + 10;
  const box = {};
  ents.forEach(e => { e.x = pad + e.c * (ew + gx); e.y = 8 + e.r * pitch; e.h = hh + e.f.length * rh + 8; box[e.n] = e; });
  let s = "";
  rels.forEach(r => {
    const a = box[r[0]], b = box[r[1]]; let x1, y1, x2, y2, d;
    if (r[4] === "left"){
      x1 = a.x; y1 = a.y + 18; x2 = b.x; y2 = b.y + 18; const lx = a.x - 20;
      d = `M${x1},${y1} H${lx} V${y2} H${x2}`;
      s += `<path d="${d}" fill="none" stroke="${C.muted}" stroke-width="1.5"/>`;
      s += txt(x1 - 8, y1 - 4, r[2], {size:11, weight:700, fill:C.berry, anchor:"end", mono:true}) + txt(x2 - 8, y2 - 4, r[3], {size:11, weight:700, fill:C.berry, anchor:"end", mono:true});
      return;
    }
    if (a.r === b.r){ const L = a.c < b.c ? [a, b] : [b, a]; const flip = L[0] !== a; x1 = L[0].x + ew; y1 = L[0].y + 18; x2 = L[1].x; y2 = L[1].y + 18; }
    else if (a.c === b.c){ const U = a.r < b.r ? a : b, D = U === a ? b : a; x1 = U.x + ew / 2; y1 = U.y + U.h; x2 = D.x + ew / 2; y2 = D.y; }
    else { const U = a.r < b.r ? a : b, D = U === a ? b : a; x1 = U.x + ew / 2; y1 = U.y + U.h; x2 = D.x + ew / 2; y2 = D.y; }
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.muted}" stroke-width="1.5"/>`;
    const t = (px, py, f) => px + (f ? 0 : 0);
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
    const first = a.r < b.r || (a.r === b.r && a.c < b.c) ? r[2] : r[3], second = first === r[2] ? r[3] : r[2];
    s += txt(x1 + ux * 12 + 7, y1 + uy * 12 + 3, first, {size:11, weight:700, fill:C.berry, mono:true});
    s += txt(x2 - ux * 12 + 7, y2 - uy * 12 + 3, second, {size:11, weight:700, fill:C.berry, mono:true});
  });
  ents.forEach(e => {
    s += `<rect x="${e.x}" y="${e.y}" width="${ew}" height="${e.h}" rx="5" fill="${C.white}" stroke="${C.berry}" stroke-width="1.5"/>`;
    s += `<path d="M${e.x},${e.y + hh} V${e.y + 5} Q${e.x},${e.y} ${e.x + 5},${e.y} H${e.x + ew - 5} Q${e.x + ew},${e.y} ${e.x + ew},${e.y + 5} V${e.y + hh} Z" fill="${C.berry}"/>`;
    s += txt(e.x + 10, e.y + 17.5, e.n, {anchor:"start", size:12.5, weight:700, fill:C.white});
    e.f.forEach((f, i) => {
      const key = /PK$/.test(f) ? "PK" : /FK$/.test(f) ? "FK" : "";
      const name = f.replace(/ (PK|FK)$/, "");
      const fy = e.y + hh + 14 + i * rh;
      if (key) s += txt(e.x + 10, fy, key, {anchor:"start", size:9.5, weight:700, fill:key === "PK" ? C.cherry : C.leaf, mono:true});
      s += txt(e.x + 34, fy, name, {anchor:"start", size:11.5, mono:true, fill:C.text});
    });
  });
  return svgWrap(W, H, s, {label:"Entity relationship diagram"});
}

/* ---------- simple horizontal chain (traceability, etc.) ---------- */
function chain(steps){
  const bw = 150, gap = 34, h = 70, W = steps.length * bw + (steps.length - 1) * gap + 4;
  const mid = uid("ch");
  let s = `<defs><marker id="${mid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${C.muted}"/></marker></defs>`;
  steps.forEach((st, i) => {
    const x = 2 + i * (bw + gap);
    s += `<rect x="${x}" y="4" width="${bw}" height="${h}" rx="7" fill="${C.white}" stroke="${C.berry}" stroke-width="1.8"/>`;
    s += txt(x + bw / 2, 22, st.k, {size:10.5, weight:700, fill:C.berry, mono:true});
    s += txt(x + bw / 2, 48, wrapText(st.t, 24), {size:11.5, lh:13, vmid:true});
    if (i < steps.length - 1) s += `<line x1="${x + bw + 2}" y1="${4 + h / 2}" x2="${x + bw + gap - 2}" y2="${4 + h / 2}" stroke="${C.muted}" stroke-width="1.8" marker-end="url(#${mid})"/>`;
  });
  return svgWrap(W, h + 8, s, {label:"Traceability chain"});
}

function table(heads, rows, o){
  o = o || {};

}

function scenarioStats(){

  STORIES.forEach(s => s.ac.forEach(a => { total++; if (/\*$/.test(a[0])) neg++; }));

/* ERD diagram definition (shared by BRD and Process documents) */
function ERD_SVG(){
  const E = (n, c, r, f) => ({n, c, r, f});
  const ents = [
    E("Location", 0, 0, ["location_id PK", "name", "timezone", "opened_on"]),
    E("MenuItem", 1, 0, ["item_id PK", "name", "station", "active"]),
    E("Recipe", 2, 0, ["recipe_id PK", "item_id FK", "ingredient_id FK", "qty_per_portion", "yield_pct", "version"]),
    E("Ingredient", 3, 0, ["ingredient_id PK", "name", "uom", "supplier_id FK"]),
    E("OrderLine", 0, 1, ["order_line_id PK", "order_id", "location_id FK", "item_id FK", "channel", "qty", "ordered_at"]),
    E("Forecast", 1, 1, ["forecast_id PK", "location_id FK", "item_id FK", "for_date", "point_qty", "range_80", "top_factors"]),
    E("Supplier", 3, 1, ["supplier_id PK", "name", "cutoff_time", "lead_time_h"]),
    E("WasteEntry", 0, 2, ["waste_id PK", "location_id FK", "item_id FK", "qty", "reason_code", "logged_at"]),
    E("PrepPlanLine", 1, 2, ["line_id PK", "plan_id FK", "item_id FK", "station", "batches", "prep_by"]),
    E("PrepPlan", 2, 2, ["plan_id PK", "location_id FK", "plan_date", "version", "status", "model_version"]),
    E("PurchaseOrder", 3, 2, ["po_id PK", "supplier_id FK", "location_id FK", "status", "drafted_by", "approved_by"]),
    E("Approval", 2, 3, ["approval_id PK", "object_type", "object_id", "decision", "user_id", "decided_at"])
  ];
  const rels = [
    ["Location", "OrderLine", "1", "N"], ["MenuItem", "OrderLine", "1", "N"], ["MenuItem", "Forecast", "1", "N"], ["Location", "Forecast", "1", "N"],
    ["MenuItem", "Recipe", "1", "N"], ["Recipe", "Ingredient", "N", "1"], ["Supplier", "Ingredient", "1", "N"], ["Supplier", "PurchaseOrder", "1", "N"],
    ["Location", "WasteEntry", "1", "N", "left"], ["Forecast", "PrepPlanLine", "1", "N"], ["PrepPlan", "PrepPlanLine", "1", "N"], ["PrepPlan", "Approval", "1", "N"], ["PurchaseOrder", "Approval", "1", "N"]
  ];
  return erd(ents, rels);
}

/* ---------- 2. Vision & Business Case ---------- */
function scenario(f){
  const years = FIN.ramp.map(r => Math.round(FIN.benefit * f * r));
  const cum = [-FIN.build]; years.forEach(b => cum.push(cum[cum.length - 1] + b - FIN.run));
  const tb = years.reduce((a, b) => a + b, 0), tc = FIN.build + FIN.run * years.length, net = tb - tc;
  let i = 0; while (i < years.length && cum[i + 1] < 0) i++;
  const pay = i >= years.length ? null : +(i * 12 + (-cum[i]) / ((years[i] - FIN.run) / 12)).toFixed(1);
  return {f, years, net, roi:Math.round(net / tc * 100), pay, cum};
}

/* ---------- 8. Requirements traceability matrix ---------- */
RENDER.rtm = function(d){
  const problems = traceCheck();
  const active = REQS.filter(r => r.pri !== "Won't"), withStory = active.filter(r => storiesFor(r).length).length, withTest = active.filter(r => r.tc).length, withBO = active.filter(r => r.bo.length).length;
  let h = "";
  h += sh("1", "Coverage summary");
  h += `<div class="tiles">${tile(String(REQS.length), "Requirements", COUNTS["Won't"] + " deferred (Won't)")}${tile(pctOf(withBO, active.length) + "%", "Linked to an objective", withBO + " of " + active.length + " active")}${tile(pctOf(withStory, active.length) + "%", "Linked to a story", withStory + " of " + active.length + " active")}${tile(String(problems.length), "Orphans and defects", problems.length ? "see below" : "automated check: pass", problems.length ? "warn" : "good")}</div>`;
  h += fig("Traceability chain used in this matrix", chain([{k:"BO-3", t:"Business objective: forecast error 15% or less"}, {k:"FR-07", t:"Requirement: show range and top factors"}, {k:"US-07", t:"Story: see the reasons behind each number"}, {k:"UC-01", t:"Use case: generate and approve the plan"}, {k:"TC-FR07", t:"Test case: UAT of range and factors"}]));
  h += problems.length ? callout("warn", "Orphan check", `<p>${problems.map(esc).join("<br>")}</p>`) : callout("ok", "Orphan check: pass", `<p>Computed from the data behind this document, not typed by hand: every active requirement has an objective, a story and a test; every story points to an existing requirement; every objective has at least one requirement; and Must-haves are ${pctOf(COUNTS.Must, REQS.length)}% of the total (ceiling 60%). Won't-have items are recorded with a reason and are exempt.</p>`);
  h += sh("2", "Objective coverage");
  h += table(["Objective", "Requirements", "Must", "Should / Could", "Tests"], BOS.map(b => { const rs = REQS.filter(r => r.bo.includes(b.id)); return [idc(b.id) + " " + esc(b.metric), String(rs.length), String(rs.filter(r => r.pri === "Must").length), String(rs.filter(r => r.pri === "Should" || r.pri === "Could").length), String(rs.length)]; }));
  h += `<div class="two"><div>${fig("Requirements per objective", barsH(BOS.map(b => ({label:b.id + " " + b.metric, value:REQS.filter(r => r.bo.includes(b.id)).length})), {w:520, labelW:230, label:"Requirements per objective"}))}</div><div>${fig("Priority mix", donut(priorityMix(), {center:String(REQS.length), sub:"requirements", size:170, label:"Priority mix"}))}</div></div>`;
  h += sh("3", "Forward traceability: objective to requirement to story to use case to test");
  h += table([{t:"Objective", w:"86px"}, {t:"Req.", w:"60px"}, "Requirement", {t:"MoSCoW", w:"70px"}, "Stories", "Use cases", {t:"Test case", w:"84px"}, {t:"Method", w:"84px"}, {t:"Rel.", w:"54px"}],
    REQS.map(r => [ids(r.bo), idc(r.id), esc(r.nm), pill(r.pri), r.pri === "Won't" ? `<span class="muted">Deferred</span>` : ids(storiesFor(r)), ucsFor(r).length ? ids(ucsFor(r)) : `<span class="muted">none</span>`, r.pri === "Won't" ? `<span class="muted">n/a</span>` : idc(r.tc), esc(r.tm), esc(r.rel)]));
  h += sh("4", "Backward traceability: story to requirement");
  h += table(["Story", "Epic", "Priority", "Requirement", "Use cases", "Scenarios"], STORIES.map(s => [idc(s.id), esc(EPICS[s.epic]), pill(s.pri), ids(s.reqs), storyUcs(s).length ? ids(storyUcs(s)) : `<span class="muted">none</span>`, String(s.ac.length)]));
  h += sh("5", "Change control");
  h += li([
    "A new requirement is added only with a business objective, a story, a test and a MoSCoW rating; otherwise it is rejected as an orphan.",
    "Changing a Must to a lower priority, or deferring it, requires sponsor approval and a note in the decision log.",
    "Any change to a requirement re-opens its stories and tests; the matrix is regenerated and the orphan check re-run.",
    "A story without a requirement is gold plating; a requirement without a story is a wish."
  ]);
  return h;
};

/* =====================================================================
   CSV EXPORTS (Excel-friendly: UTF-8 BOM, CRLF, quoted cells)
   ===================================================================== */
function toCSV(head, rows){
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  return "﻿" + [head].concat(rows).map(r => r.map(q).join(",")).join("\r\n") + "\r\n";
}
const CSV = {
  stories(){
    return toCSV(["Story ID", "Epic", "Persona", "Persona role", "As a", "I want", "So that", "MoSCoW", "Requirements", "Use cases", "Scenarios", "Unhappy-path scenarios", "Acceptance criteria (Given / When / Then)"],
      STORIES.map(s => { const p = persona(s.p); return [s.id, EPICS[s.epic], p.name, p.role, p.role.split(",")[0], s.want, s.so, s.pri, s.reqs.join("; "), storyUcs(s).join("; "), s.ac.length, s.ac.filter(a => /\*$/.test(a[0])).length,
        s.ac.map((a, i) => "Scenario " + (i + 1) + ": " + a[0].replace(/\*$/, "") + (/\*$/.test(a[0]) ? " [unhappy path]" : "") + "\nGiven " + a[1] + "\nWhen " + a[2] + "\nThen " + a[3]).join("\n\n")]; }));
  },
  stakeholders(){
    return toCSV(["ID", "Stakeholder", "Role", "Power", "Interest", "Quadrant", "Primary concern", "Engagement strategy", "Cadence", "RACI: BRD", "RACI: Vision & Business Case", "RACI: User Stories", "RACI: RTM", "RACI: Process Maps"],
      STAKE.map(s => [s.id, s.name, s.role, s.power, s.interest, s.quad, s.concern, s.strategy, s.cadence, s.raci.BRD, s.raci.VBC, s.raci.Stories, s.raci.RTM, s.raci.Process]));
  },
  rtm(){
    return toCSV(["Objective(s)", "Requirement ID", "Type", "Category", "Requirement name", "Requirement text", "MoSCoW", "Release", "Stories", "Use cases", "Test case", "Test method", "Status"],
      REQS.map(r => [r.bo.join("; "), r.id, r.type, r.cat, r.nm, r.text, r.pri, r.rel, r.pri === "Won't" ? "Deferred" : storiesFor(r).join("; "), ucsFor(r).join("; "), r.pri === "Won't" ? "" : r.tc, r.tm, r.pri === "Won't" ? "Deferred" : "Not started"]));
  },
  requirements(){
    return toCSV(["ID", "Type", "Category", "Name", "Requirement", "MoSCoW", "Release", "Objectives", "Test method"],
      REQS.map(r => [r.id, r.type, r.cat, r.nm, r.text, r.pri, r.rel, r.bo.join("; "), r.tm]));
  }
};

function gt(heads, rows){
  return `<div class="tscroll"><table class="t"><thead><tr>${heads.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

  h += `<h2>Non-functional categories to check every time</h2>` + gt(["Category", "Question to ask", "Example target"], [
    ["Performance", "How fast, at what load, measured where?", "Screen loads in 2.0 s or less at p95 on a 10-inch tablet (NFR-01)"],
    ["Availability", "When must it be up, and what happens when it is down?", "99.5% from 05:00 to 23:00; fall back to last approved sheet (NFR-02)"],
    ["Security", "Who can access what, and how is data protected?", "Single sign-on, TLS 1.2+, no card data stored (NFR-03)"],
    ["Privacy", "What personal data is collected, used, retained?", "Guest personal data excluded from forecasts and logs (NFR-08)"],
    ["Data quality", "How do we know the data is right?", "Order totals reconcile to POS within 0.5% (NFR-06)"],
    ["Usability", "Who must use it, with what training?", "First approval within 10 minutes after 30 minutes of training (NFR-05)"],
    ["Scalability", "What growth must it absorb?", "7 to 20 locations without architectural change (NFR-07)"]
  ]);
  h += `<h2>Additional non-functional requirements for AI features</h2>` + gt(["Category", "Question to ask"], [
    ["Accuracy", "What error is acceptable, on which items, measured how? (NFR-04: 15% MAPE or less by month 3)"],
    ["Explainability", "Can a user see why the system recommended this? (FR-07, NFR-04)"],
    ["Human override and approval", "Which actions require a named human before they happen? (FR-10, FR-16, FR-19)"],
    ["Auditability", "Can we reconstruct what the AI said and what the human decided? (FR-25)"],
    ["Fallback", "What happens when the model or its data is unavailable? (US-05, NFR-02)"],
    ["Drift and review", "How will we notice the model getting worse? (FR-08)"]
  ]);
  h += `<h2>Try it: classify each statement</h2>` +
    reveal("1. The system shall mark an item unavailable on all channels within 60 seconds of confirmation.", "<p><b>Functional</b> (the behavior), with a non-functional measure inside it (60 seconds). Good requirements often contain both; split them if the number needs its own test.</p>") +
    reveal("2. The system shall be user-friendly.", "<p><b>Non-functional, and defective.</b> There is no number. Rewrite: a new General Manager completes a first approval within 10 minutes after 30 minutes of training (NFR-05).</p>") +
    reveal("3. The system shall be secure.", "<p><b>Non-functional, and defective.</b> Ask: against what threat, measured how? Rewrite with specifics, as in NFR-03.</p>") +
    reveal("4. The system shall display the top three factors behind each forecast.", "<p><b>Functional</b> (a behavior the user can see), which also serves the explainability non-functional need.</p>");
  return h;
};

/* ---------- 4. User stories ---------- */
TEACH["user-stories"] = function(){
  let h = intro("The discipline &middot; 04", "User stories", "A user story states a need from one person's point of view: <b>As a</b> persona, <b>I want</b> a capability, <b>so that</b> I get a benefit. It is a promise to have a conversation and a unit you can build, test and demo.");
  h += exhibit("A story from the worked example, with its acceptance criteria", storyCard("US-10"));
  h += `<h2>Is it a good story? The INVEST check</h2>` + gt(["Letter", "Test", "US-10 passes because"], [
    ["<b>I</b>ndependent", "Can it be built and released without another story?", "It depends on a plan existing, but not on the dashboard or purchasing"],
    ["<b>N</b>egotiable", "Does it state the need, not the screen layout?", "It says approve, edit or reject, not which buttons"],
    ["<b>V</b>aluable", "Does a named person get a clear benefit?", "Dana keeps control over what reaches her kitchen"],
    ["<b>E</b>stimable", "Can the team size it?", "The three scenarios define the behavior"],
    ["<b>S</b>mall", "Fits in one iteration?", "One screen and one state machine"],
    ["<b>T</b>estable", "Can a tester pass or fail it?", "Every scenario has an observable Then"]
  ]);
  h += `<h2>Weak versus strong</h2>` + gt(["Weak story", "Why it fails", "Stronger version"], [
    ["As a user, I want a dashboard.", "Which user? Which decision? No benefit", `${idc("US-23")} As a Regional Operations Director, I want a regional dashboard of waste, availability and forecast accuracy, so that I can see which location is drifting`],
    ["As a manager, I want the AI to do the ordering.", "Hides a human-control decision; unbounded", `${idc("US-19")} As Purchasing, I want no purchase order to reach a supplier without my approval, so that the AI can suggest but never commit money`],
    ["As the system, I shall store data.", "Not a user need; no persona", "Reframe around who uses the data and for what, as in US-01"]
  ]);
  h += `<h2>Stories versus requirements</h2><p>A <b>requirement</b> is a formal statement the business agrees to ("The system shall..."). A <b>story</b> expresses the same need as a person's goal and carries the acceptance scenarios. Keep both: requirements give you priority and traceability; stories give you intent and tests. The full set is in ${link("doc-us", "the User Stories document")}.</p>`;
  h += gcall("ok", "How to split a large story", `<p>Split by workflow step, by business rule, or by happy path versus unhappy path. US-16 (availability sync) is deliberately three scenarios: the sync, the channel failure, and the rule that the AI alone cannot mark an item unavailable.</p>`);
  return h;
};

/* ---------- 5. Acceptance criteria ---------- */
TEACH.acceptance = function(){
  let h = intro("The discipline &middot; 05", "Acceptance criteria", "Acceptance criteria are the conditions that must be true for a story to count as done. Written as <b>Given / When / Then</b>, they double as the first draft of the test.");
  h += `<div class="grid3"><div class="card"><span class="tag">Given</span><h3>The starting state</h3><p>Concrete data and context: "the Back Bay POS does not respond within 10 seconds".</p></div><div class="card"><span class="tag">When</span><h3>The action or event</h3><p>One thing happens: "the ingest job runs".</p></div><div class="card"><span class="tag">Then</span><h3>The observable result</h3><p>Something a tester can see or measure: "it retries 3 times, then shows the location as stale".</p></div></div>`;
  h += `<h2>Rules for good criteria</h2>` + li(["One behavior per scenario.", "Use real values (40 order lines, 8%, 60 seconds), not 'some' or 'quickly'.", "Describe what is observable, not how it is implemented.", "Include at least one unhappy path per story: missing data, timeout, duplicate, refusal.", "A criterion you cannot fail is not a criterion."]);
  h += `<h2>The trust scenario</h2>`;
  h += gcall("key", "Definition", `<p>A <b>trust scenario</b> proves the system does <i>not</i> act without a human where the business requires one. Every story that touches a human gate needs one. A story is not done until its trust scenario passes.</p>`);
  h += exhibit("US-16 contains a trust scenario (scenario 3)", storyCard("US-16"));
  h += `<h2>Scenarios AI drafts usually omit</h2>` + gt(["Scenario type", "Ask", "Example"], [
    ["Missing or low-quality data", "What if the input is absent or thin?", `${idc("US-05")} a new item with under 14 days of sales`],
    ["Dependency failure", "What if a service times out?", `${idc("US-01")} POS does not respond within 10 seconds`],
    ["Duplicate or repeat (idempotency)", "What if the same event arrives twice?", `${idc("US-01")} duplicate order id is ignored`],
    ["Human rejects", "What if the reviewer says no?", `${idc("US-10")} reject with a reason`],
    ["Bypass attempt", "Can the gate be skipped by an API call or service account?", `${idc("US-19")} a service account tries to send a purchase order`],
    ["Stale or incomplete data shown to users", "Does the screen tell the truth about its data?", `${idc("US-23")} stale tile shown in amber`]
  ]);
  h += `<h2>Weak versus strong</h2>` + gt(["Weak", "Strong"], [
    ["The system responds quickly to the manager.", "Given the plan has 64 lines, when the manager opens it on a 10-inch tablet, then it loads in 2.0 s or less at the 95th percentile."],
    ["Errors are handled gracefully.", "Given the delivery platform API fails after 10 seconds, when the sync runs, then it retries 3 times and shows 'Delivery not updated - call platform'."]
  ]);
  return h;
};

/* ---------- 6. MoSCoW ---------- */
TEACH.moscow = function(){
  let h = intro("The discipline &middot; 06", "MoSCoW prioritization", "MoSCoW forces a decision about what matters if time or money runs out. It only works if <i>Must</i> is rare.");
  h += gt(["Level", "Meaning", "Test question", "Typical share"], [
    [pill("Must"), "The release fails, is unsafe or breaks the rules without it", "If we removed this, would we still ship?", "About 40 to 60%"],
    [pill("Should"), "Important, but there is a workaround", "Can the business cope for one release?", "About 20 to 30%"],
    [pill("Could"), "Desirable; first to go if time is short", "Would anyone notice?", "About 10 to 20%"],
    [pill("Won't"), "Agreed not to do in this release", "Have we written down why?", "Whatever remains"]
  ]);
  h += `<h2>In the worked example</h2><div class="grid2"><div>${exhibit("Priority mix, all " + REQS.length + " requirements", donut(priorityMix(), {center:String(REQS.length), sub:"requirements", label:"Priority mix"}))}</div><div>`;
  h += gt(["Priority", "Count", "Share"], ["Must", "Should", "Could", "Won't"].map(k => [pill(k), String(COUNTS[k]), pctOf(COUNTS[k], REQS.length) + "%"]));
  h += `<p>Must-haves are ${pctOf(COUNTS.Must, REQS.length)}% of the total. The automated check in the traceability matrix flags anything above 60%.</p></div></div>`;
  h += `<h2>A worked judgment</h2>` + gcall("", "FR-15, the stockout alert", `<p>It looks essential, and an AI draft would mark it Must. But a General Manager can still notice a shortage and confirm an item as unavailable by hand (FR-16, a Must). The alert improves the outcome; it is not required to ship. So it is <b>Should</b>, and the reason is recorded.</p>`);
  h += `<h2>Pitfalls</h2>` + li(["<b>Everything is a Must.</b> The most common AI-draft failure. Ask for the Must list to be justified line by line.", "<b>Priority confused with sequence.</b> A Must can ship in release 2; priority says importance, the release plan says order.", "<b>Won't treated as failure.</b> A reasoned Won't protects scope (see FR-27 to FR-29).", "<b>No owner.</b> Priorities are a business decision. The architect challenges them; the sponsor decides."]);
  return h;
};

/* ---------- 7. Personas ---------- */
TEACH["personas-t"] = function(){
  const p = PERSONAS[0];
  let h = intro("The discipline &middot; 07", "Personas", "A persona is a composite character that stands for a group of users. Its job is to make requirements specific to a person's goals, frustrations and authority.");
  h += `<div class="grid2"><div class="card"><h3>What a useful persona contains</h3>${li(["A name and role", "Goals: what they are trying to achieve", "Frustrations: what gets in the way today", "Decision rights: what they may approve", "Working context and what success looks like"])}</div>
  <div class="card"><h3>What to leave out</h3>${li(["Age, gender, photos, hobbies", "Marketing-style slogans", "Anything that does not change a requirement"])}<p>Demographics invite stereotype. Decision rights change the design.</p></div></div>`;
  h += `<h2>Example: ${esc(p.name)}, ${esc(p.role)}</h2>`;
  h += gt(["", ""], [["<b>Goals</b>", li(p.goals.map(esc))], ["<b>Frustrations</b>", li(p.frustrations.map(esc))], ["<b>Decision rights</b>", esc(p.authority)]]);
  h += `<p>All six personas, the authority map and the persona-to-story coverage are in ${link("doc-per", "the Personas document")}.</p>`;
  h += `<h2>Checks when AI drafts personas</h2>` + li(["Are they generic ('busy professional')? Ask for goals tied to this process.", "Is the decision-rights line present? If not, approval design will be guessed.", "Does every story name a persona, and does every persona have at least one story?", "Are they labelled as hypotheses until validated with real interviews?"]);
  return h;
};

/* ---------- 8. Use cases ---------- */
TEACH["usecases-t"] = function(){
  const u = UCS[1];
  let h = intro("The discipline &middot; 08", "Use cases", "A use case describes one goal an actor achieves with the system, step by step, including variations and failures. Use stories to say <i>what is wanted</i>; use use cases to say <i>exactly what happens</i> when several actors and systems are involved.");
  h += gt(["Part", "Meaning"], [["Actor and goal", "Who is doing what, to achieve what"], ["Trigger and preconditions", "What starts it, and what must already be true"], ["<b>Main flow</b>", "The successful path, numbered"], ["<b>Alternate flows</b>", "Valid variations: the user chooses differently"], ["<b>Exception flows</b>", "Failures the system must handle: timeouts, missing data, refusals"], ["Postconditions and business rules", "What is true afterward; the rules that govern it"]]);
  h += `<h2>Example: ${esc(u.id)} ${esc(u.name)}</h2><h3>Main flow</h3>` + ol(u.main.map(esc)) + `<h3>Exception flows</h3>` + gt(["#", "Failure", "What the system does"], u.exc.map(a => [idc(a[0]), esc(a[1]), esc(a[2])]));
  h += exhibit("Sequence diagram for UC-02", sequence(seqSpec("uc2")));
  h += gcall("key", "Where the human gate shows up", `<p>Step 4 and the first note in the diagram: only the General Manager confirms. Exception E2 says what happens when the GM is unavailable: the system escalates to a person. It never decides for them.</p>`);
  h += `<p>All six use cases are in ${link("doc-uc", "the Use Cases document")}.</p>`;
  return h;
};

/* ---------- 9. Traceability ---------- */
TEACH["trace-t"] = function(){
  const bo2 = REQS.filter(r => r.bo.includes("BO-2"));
  let h = intro("The discipline &middot; 09", "Traceability", "Traceability links every business objective to the requirements that serve it, the stories and use cases that describe it, and the tests that prove it. It is how you find what is missing, what is extra, and what a change will touch.");
  h += exhibit("The chain", chain([{k:"BO-3", t:"Objective: forecast error 15% or less"}, {k:"FR-07", t:"Requirement: show range and top factors"}, {k:"US-07", t:"Story: see the reasons behind each number"}, {k:"UC-01", t:"Use case: generate and approve plan"}, {k:"TC-FR07", t:"Test: UAT of range and factors"}]));
  h += `<h2>Two directions</h2>` + gt(["Direction", "Question", "Finds"], [["Forward (objective to test)", "Is every objective fully covered and tested?", "Gaps"], ["Backward (test to objective)", "Why does this exist?", "Gold plating and orphans"]]);
  h += `<h2>Orphans</h2><p>An <b>orphan requirement</b> has no objective, no story or no test. An <b>orphan story</b> points to nothing. Both are defects: the first is unfunded scope or a wish, the second is a feature nobody asked for. In this guide the check runs automatically over the data behind the documents: <b>${traceCheck().length === 0 ? "no orphans found" : traceCheck().length + " findings"}</b>.</p>`;
  h += `<h2>Impact analysis in one line</h2><p>If objective BO-2 (unavailable-item lines) changes, these ${bo2.length} requirements need review: ${ids(bo2.map(r => r.id))}. Without the matrix you would find out in testing.</p>`;
  h += `<h2>Sample rows</h2>` + gt(["Objective", "Requirement", "Story", "Use case", "Test"], ["FR-07", "FR-10", "FR-16", "FR-19"].map(id => { const r = reqById(id); return [ids(r.bo), idc(r.id) + " " + esc(r.nm), ids(storiesFor(r)), ids(ucsFor(r)), idc(r.tc)]; }));
  h += `<p>The full matrix, with both directions and a CSV export, is ${link("doc-rtm", "Document 8")}.</p>`;
  return h;
};

/* ---------- 10. Good vs bad ---------- */
TEACH["good-bad"] = function(){
  let h = intro("The discipline &middot; 10", "Good versus bad requirements", "A good requirement is a sentence two people cannot read differently, that a tester can pass or fail, and that traces to a business need.");
  h += gt(["Bad (typical AI draft)", "What is wrong", "Good (from the example)"], [
    ["The system should forecast demand accurately.", "'Accurately' has no number; no horizon, no scope", `${idc("FR-05")} generate by 04:00 an item-level forecast per location for the next 7 days; ${idc("NFR-04")} MAPE 15% or less on the top 20 items by month 3`],
    ["The app should be fast.", "Fast for whom, where, measured how?", `${idc("NFR-01")} loads in 2.0 s or less at p95 on a 10-inch tablet`],
    ["The AI will manage ordering.", "Unbounded and hides a control decision", `${idc("FR-19")} no purchase order is transmitted until Purchasing approves it`],
    ["The system will integrate with all channels.", "'All' and 'integrate' are undefined", `${idc("FR-16")} mark unavailable on POS, web, app and delivery within 60 seconds of confirmation`],
    ["Users can easily log waste.", "'Easily' is an opinion", `${idc("FR-21")} log a waste entry in no more than 3 taps, including offline`],
    ["The system must handle errors.", "Which errors, handled how?", `${idc("US-01")} retry 3 times with backoff, then mark the location stale`]
  ]);
  h += `<h2>The quality checklist</h2>` + gt(["Quality", "Ask"], [["Single", "Does it say exactly one thing?"], ["Unambiguous", "Could two readers disagree on what it means?"], ["Measurable", "Is there a number, a unit and a condition?"], ["Testable", "Could a tester write a pass-or-fail check today?"], ["Necessary", "Which objective needs it?"], ["Feasible", "Can it be built within the constraints?"], ["Prioritized", "Is it MoSCoW rated, with a reason?"], ["Traceable", "Does it link to an objective, a story and a test?"]]);
  h += `<h2>Words that signal a vague requirement</h2><div class="chips">${["fast", "easy", "user-friendly", "robust", "seamless", "flexible", "scalable", "secure", "real-time", "intuitive", "etc.", "and/or", "as appropriate", "all", "adequate", "efficient"].map(w => `<span class="chip">${esc(w)}</span>`).join("")}</div><p>When you see one, ask: <i>compared with what, for whom, measured how?</i></p>`;
  h += `<h2>Try it: review this AI-written requirement</h2>`;
  h += gcall("warn", "AI draft", `<p>"REQ-7 (Must): The system shall provide a robust, real-time dashboard that allows managers to easily view all KPIs and make better decisions."</p>`);
  h += reveal("What is wrong with it?", "<ul><li><b>Robust, real-time, easily, better</b> are vague; none can be tested.</li><li><b>All KPIs</b> is undefined: which KPIs?</li><li><b>Must</b> has no reason.</li><li>No persona, no objective, no test method.</li><li>Rewrite: " + esc(reqById("FR-23").text) + "</li></ul>");
  return h;
};

/* ---------- 11. KPIs ---------- */
TEACH.kpis = function(){
  let h = intro("The discipline &middot; 11", "KPIs", "A KPI is a measure of progress toward a business objective, with a baseline, a target, a source, an owner and a rhythm. Without those five things it is a decoration.");
  h += `<h2>A KPI definition template</h2>` + gt(["Field", "Question", "Example (BO-1)"], [
    ["Name and definition", "What exactly is counted?", "Food waste: value of discarded product as a share of food purchases"],
    ["Formula", "How is it calculated?", "Sum of logged waste value / sum of purchase invoices, per week"],
    ["Baseline", "Where are we now, and how do we know?", "11.2%, trailing 90 days"],
    ["Target and date", "What good looks like, by when", "6.5% or less within 12 months of full rollout"],
    ["Source", "Which system or log?", "Waste log and purchase invoices"],
    ["Owner and cadence", "Who acts, how often?", "Priya Raman, weekly"],
    ["Action trigger", "What happens when it moves?", "Two amber weeks in a row: location review"]
  ]);
  h += `<h2>The five objectives as KPIs</h2>` + gt(["ID", "Metric", "Baseline", "Target", "Owner", "Cadence"], BOS.map(b => [idc(b.id), esc(b.metric), esc(b.baseline), `<b>${esc(b.target)}</b>`, esc(b.owner), esc(b.cadence)]));
  h += exhibit("Baseline versus target", beforeAfter([{label:"Food waste, % of purchases", before:11.2, after:6.5, bl:"11.2%", tl:"6.5%"}, {label:"Unavailable-item order lines", before:3.1, after:1.0, bl:"3.1%", tl:"1.0%"}, {label:"Forecast error, top 20 items", before:28, after:15, bl:"28%", tl:"15%"}, {label:"Daily planning time per manager", before:55, after:15, bl:"55 min", tl:"15 min"}]));
  h += `<h2>Leading and lagging</h2>` + gt(["Type", "Meaning", "Example"], [["Lagging", "Outcome you care about; slow to move", "Food waste % (BO-1)"], ["Leading", "Early signal you can act on", "Share of plan lines edited by managers; low-confidence lines per day"], ["Guardrail", "Something that must not get worse while you improve the target", "Unavailable-item % must not rise while waste falls"]]);
  h += gcall("warn", "Beware gaming", `<p>Waste can be reduced by under-prepping, which raises sold-out items. That is why BO-1 and BO-2 are always read together, and why BO-5 (100% human-approved releases) is a guardrail on the whole programme.</p>`);
  return h;
};

/* ---------- 12. Review lens ---------- */
const PROMPT_TEXT = `You are a senior Business Analyst. Draft a Business Requirements Document for ${CO.name}, a ${CO.locations}-location fast-casual restaurant group, for an AI-assisted prep planning and item-availability initiative.

Context: [paste the objectives, baselines and owners here]. Personas: [list]. Constraints: [list].

Quality bar:
- Every requirement uses "shall", has one measurable condition, a MoSCoW priority with a one-line reason, and a test method.
- No more than 60% of requirements may be Must. Include a Won't list with reasons.
- Include non-functional requirements with numbers, and AI-specific ones: accuracy, explainability, human approval, audit, fallback.
- Every requirement must trace to a numbered business objective. Do not create requirements without one.
- Write at least one unhappy-path acceptance scenario (Given/When/Then) per story, including one scenario that proves the system refuses to act without a human where approval is required.

Before the document, list every assumption you made and every number you invented so I can verify them. Do not invent stakeholders. If information is missing, ask me.`;
TEACH["review-lens"] = function(){
  let h = intro("The discipline &middot; 12", "The architect's review lens", "When AI drafts the requirements, your job is to be the reviewer who cannot be fooled by fluency. Use these twelve questions, in four groups, on every document before you sign.");
  const Q = [
    ["Purpose", "1. Is the problem stated with a baseline?", "A number, a source and a date", "Adjectives such as 'inefficient' with no figure"],
    ["Purpose", "2. Does every requirement trace to an objective?", "No orphans; the RTM says so", "Requirements nobody can explain"],
    ["Purpose", "3. Are the objectives measurable, owned and timed?", "Target, owner, cadence", "'Improve' with no target"],
    ["Quality", "4. Is each requirement specific and testable?", "Number, unit, condition, test method", "Fast, robust, seamless, easy"],
    ["Quality", "5. Is MoSCoW credible?", "Must under about 60%, with reasons; a Won't list", "Everything is Must"],
    ["Quality", "6. Are non-functional requirements present and numeric?", "Performance, availability, security, privacy, data quality", "Section missing or generic"],
    ["Safety and AI", "7. Where does a human decide?", "Named gates in code, with a trust scenario each", "'The AI will handle it'"],
    ["Safety and AI", "8. Can the AI's output be explained and audited?", "Rationale shown; append-only log", "Black-box output, no record"],
    ["Safety and AI", "9. What happens when the AI or its data fails?", "Fallback to last approved state; stale data labelled", "Only the happy path"],
    ["Completeness", "10. Are unhappy paths written?", "Timeout, duplicate, missing data, refusal", "Every scenario succeeds"],
    ["Completeness", "11. Are assumptions and invented numbers listed?", "An assumptions table with owners", "Precise figures with no source"],
    ["Completeness", "12. Are stakeholders real and decisions assigned?", "Named roles, open decisions with dates", "Invented names, no owners"]
  ];
  h += gt(["Group", "Question", "Pass looks like", "Red flag"], Q.map(q => [`<b>${esc(q[0])}</b>`, esc(q[1]), esc(q[2]), esc(q[3])]));
  h += `<h2>A five-step review</h2>` + ol(["<b>Read the objectives and the Executive Summary first.</b> If the numbers do not make sense, stop.", "<b>Check traceability.</b> Look at the orphan check and the coverage per objective.", "<b>Sample five requirements.</b> Pick two Musts, one NFR, one Could and one Won't; run the quality checklist on each.", "<b>Probe the gates.</b> Find every place the system could act on its own and ask for the trust scenario.", "<b>Decide and record.</b> Approve, approve with changes, or reject, in writing."]);
  h += `<h2>Directing the AI: a brief that gets a reviewable draft</h2><p>Most poor drafts come from a poor brief. This template is the one used for the worked example's BRD. Replace the bracketed parts with your own material.</p>`;
  h += `<pre class="code" id="promptBox">${esc(PROMPT_TEXT)}</pre><p><button class="btn sm" data-copy="promptBox">Copy the brief</button></p>`;
  h += `<h2>Decision record</h2>` + gt(["Field", "Example"], [["Decision", "Approve with changes"], ["Document and version", "BRD v1.0"], ["Conditions", "Close D-01 (price variance threshold) and D-02 (delegate rules) before Gate 0"], ["Findings", "Two Musts demoted to Should after review; NFR-05 given a number"], ["Approver and date", "Name, role, date; the AI never signs"]]);
  h += gcall("key", "Practice", `<p>Open ${link("doc-brd", "the BRD")} and apply the twelve questions. Then open ${link("doc-rtm", "the traceability matrix")} and try to find an orphan. You will not, and the reason is the data model that generates every document.</p>`);
  return h;
};

/* ---------- The example ---------- */
TEACH.example = function(){
  let h = intro("The example", CO.name + ": " + CO.project, `A fictional ${CO.locations}-location fast-casual restaurant group in Greater Boston introduces AI-assisted prep planning and item availability. Industry: <b>${CO.industry}</b>.`);
  h += gt(["Fact", "Value"], [["Locations", CO.locations + " (pilot: Seaport and Back Bay)"], ["Revenue", "About $" + CO.revenue + "M a year ($" + CO.revenuePerLoc + "M per location)"], ["Food purchases", "About $" + CO.foodPurchases.toFixed(1) + "M a year"], ["Menu", CO.menuItems + " active items, " + CO.ingredients + " ingredients"], ["Channels", "Dine-in and counter, pickup, delivery, catering, phone"], ["Executive sponsor", CO.sponsor], ["Funding requested", "$" + FIN.build + "K build; $" + FIN.run + "K a year to run"]]);
  h += `<h2>The five objectives</h2>` + gt(["ID", "Objective"], BOS.map(b => [idc(b.id), esc(b.text)]));

const FAQ = [
 {q:"What is business analysis in one sentence?", a:"Business analysis is the work of deciding, in writing and before the build, what problem is being solved, for whom, and how everyone will know it is solved. It turns needs into specific, measurable, prioritized, traceable requirements.", s:"why-ba", k:"definition BA discipline"},
 {q:"Why does an AI Solution Architect need business analysis skills?", a:"AI can draft requirements in seconds, but the draft may be plausible and wrong: invented numbers, everything marked Must, missing unhappy paths. The architect has to direct the work with a good brief, evaluate the output against a quality bar, and approve it knowing what they are accountable for.", s:"why-ba", k:"architect AI direct evaluate approve"},
 {q:"What is the 20% of business analysis I need to know?", a:"Seven concepts: functional versus non-functional requirements, user stories, acceptance criteria, MoSCoW prioritization, personas, use cases and traceability. Together with good-versus-bad requirements, KPIs and the architect's review lens, they let you direct, evaluate and approve AI-generated requirements.", s:"the-20", k:"20 percent seven concepts"},
 {q:"What is the difference between functional and non-functional requirements?", a:"A functional requirement says what the system does (for example, mark an item unavailable on every channel within 60 seconds). A non-functional requirement says how well it must do it: performance, availability, security, privacy, usability, scalability, data quality, and for AI also accuracy, explainability and human approval. If it is an adjective, it needs a number.", s:"functional", k:"functional nonfunctional NFR difference"},

 {q:"What is a user story?", a:"A user story states a need from one persona's point of view: As a persona, I want a capability, so that I get a benefit. It is small enough to build and test in one iteration and carries acceptance scenarios.", s:"user-stories", k:"story as a I want so that"},

 {q:"What is MoSCoW?", a:"MoSCoW sorts requirements into Must (the release fails without it), Should (important, with a workaround), Could (desirable) and Won't (agreed not to do this release). It only works when Must is rare.", s:"moscow", k:"moscow priority must should could wont"},
 {q:"How many requirements should be Must?", a:"As a rule, about 40 to 60% and no more than 60%. In the example, " + COUNTS.Must + " of " + REQS.length + " requirements (" + pctOf(COUNTS.Must, REQS.length) + "%) are Must, and the traceability check flags anything above 60%. If an AI draft marks everything Must, ask for each Must to be justified.", s:"moscow", k:"everything is must percentage ceiling 60"},

 {q:"What is a use case and how is it different from a user story?", a:"A story says what a persona wants and why. A use case says exactly what happens, step by step, between actors and systems, including alternate flows and exception flows. Use stories for intent and tests; use use cases for complex, multi-actor or integration-heavy flows.", s:"usecases-t", k:"use case story difference main flow"},

 {q:"What is traceability and what is an RTM?", a:"Traceability links each business objective to the requirements that serve it, the stories and use cases that describe them, and the tests that prove them. A Requirements Traceability Matrix (RTM) is the table that records those links in both directions.", s:"trace-t", k:"traceability RTM matrix"},

 {q:"What are red flags in AI-written requirements?", a:"Everything marked Must; numbers with no source; invented stakeholders; vague words without measures; no non-functional requirements; no unhappy paths; requirements with no objective; and phrases like 'the AI will handle it' where a human should decide.", s:"review-lens", k:"red flags warning AI draft hallucination invented"},
 {q:"How do I direct an AI to write better requirements?", a:"Give it the objectives and context, the personas and constraints, an explicit quality bar (shall, one measurable condition, MoSCoW with reasons, test method, a Must ceiling), the instruction to trace every requirement to an objective, and the instruction to list every assumption and every number it invented before the document.", s:"review-lens", k:"prompt brief direct AI template"},
 {q:"When should I approve, approve with changes, or reject?", a:"Approve when the document passes the review lens as written. Approve with changes when issues are specific and fixable without rework, and list the conditions. Reject when objectives are missing, requirements are largely untestable, or the human gates are not defined. Record the decision with your name and date; the AI never signs.", s:"review-lens", k:"approve reject decision record sign"},

const STOP = new Set("a an the and or of to in on for with is are was were be been it its this that these those do does did how what which who whom why when where can could should would will shall i me my we our you your as at by from into about than then so if not no any all each per vs via".split(" "));
function stem(w){
  if (w.length > 4 && w.endsWith("ies")) return w.slice(0, -3) + "y";
  if (w.length > 5 && w.endsWith("ing")) return w.slice(0, -3);
  if (w.length > 4 && w.endsWith("ed")) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) return w.slice(0, -1);
  return w;
}
function tokens(s){
  s = String(s).toLowerCase().replace(/([a-z]+)-(\d+)/g, "$1$2").replace(/86'd/g, "86d").replace(/non-functional/g, "nonfunctional").replace(/won't/g, "wont").replace(/[‘’']/g, "");
  return s.split(/[^a-z0-9]+/).filter(w => w && !STOP.has(w)).map(stem);
}
const INDEX = [];
let DF = {}, NCH = 0;

function addChunk(sec, head, text, el, extra){
  text = text.replace(/\s+/g, " ").trim();
  if (text.length < 3) return;
  const c = Object.assign({sec:sec.id, secTitle:sec.t, head, text, el}, extra || {});
  c.tTok = tokens(head + " " + (c.title || "") + " " + (c.keys || ""));
  c.bTok = tokens(text);
  const set = new Set(c.tTok.concat(c.bTok));
  set.forEach(t => { DF[t] = (DF[t] || 0) + 1; });
  INDEX.push(c);
}
function buildIndex(){
